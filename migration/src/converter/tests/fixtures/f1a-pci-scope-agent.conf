<agent_config>
  <labels>
    <label key="compliance.scope">pci</label>
  </labels>
  <syscheck>
    <frequency>3600</frequency>
  </syscheck>
</agent_config>
<agent_config os="Linux">
  <syscheck>
    <directories check_all="yes" realtime="yes">/opt/acme/conf</directories>
  </syscheck>
</agent_config>
<agent_config os="Windows">
  <syscheck>
    <directories check_all="yes" realtime="yes">C:\acme\conf</directories>
  </syscheck>
</agent_config>
