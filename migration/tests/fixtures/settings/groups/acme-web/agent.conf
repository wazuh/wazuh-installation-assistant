<agent_config>
  <!-- ACME: web hosts keep 20000 events while the manager is unreachable -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>20000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/acme-web/access.log</location>
  </localfile>
</agent_config>
