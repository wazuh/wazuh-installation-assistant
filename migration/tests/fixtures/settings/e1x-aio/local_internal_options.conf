# local_internal_options.conf
#
# This file should be handled with care. It contains
# run time modifications that can affect the use
# of OSSEC. Only change it if you know what you
# are doing. Look first at ossec.conf
# for most of the things you want to change.
#
# This file will not be overwritten during upgrades.

# ACME: custom decoders with many fields
analysisd.decoder_order_size=512

# C4 exercise: this site's 4.x log rotation and retention (monitord, renamed in 5.0)
monitord.rotate_log=1
monitord.compress=1
monitord.keep_log_days=2
monitord.size_rotate=1
monitord.daily_rotations=24
# valid on 4.x [0..600], out of range on 5.0 [1..600]
monitord.day_wait=0
# C4 exercise: transport tuning 5.0 still reads
remoted.recv_counter_flush=256
wazuh_db.worker_pool_size=6
# C4 exercise: an agent-side key set on the manager
logcollector.remote_commands=1
