run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
    && format('Test Integration Tools - Manual {0} [{1}] on {2}', inputs.tool_type, inputs.install_mode, inputs.pr_head_ref)
    || format('Test Integration Tools - #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) }}
name: (5.x) PR Check - Test Integration Tools

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_head_ref:
        description: 'Branch of wazuh installation assistant'
        required: true
        type: string
      automation_reference:
        description: 'Branch of wazuh-automation to use'
        required: false
        default: '5.0.0'
        type: string
      tool_type:
        description: 'Tool to test'
        required: true
        type: choice
        options:
          - installer
          - cert-tool
          - passwords-tool
          - all
      install_mode:
        description: 'Installation mode (installer tool only)'
        required: false
        default: 'aio'
        type: choice
        options:
          - aio
          - distributed
          - offline
      package_type:
        description: 'Package source'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      systems:
        description: 'Systems to test — comma-separated (e.g. ubuntu-24-amd64,redhat-9-arm64) or "all".'
        required: false
        default: 'all'
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

env:
  # A label run uses the wazuh-automation branch named as the base branch of the PR
  AUTOMATION_REFERENCE: ${{ inputs.automation_reference || github.base_ref || 'main' }}
  ALLOCATOR_PATH: /tmp/allocator_instance
  REGION: us-east-1
  GENERATE_PRESIGNED_URLS_SCRIPT_PATH: wazuh-automation/tools/sign_urls/generate_presigned_dev_urls.py
  SG_NO_INTERNET: ${{ vars.AWS_SG_OFFLINE }}
  ALL_SYSTEMS: '["ubuntu-24-amd64","ubuntu-24-arm64","ubuntu-22-amd64","ubuntu-22-arm64","redhat-9-amd64","redhat-9-arm64","redhat-10-amd64","redhat-10-arm64"]' # Commented unti fix allocator "amazon-2023-amd64","amazon-2023-arm64"

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Parse the PR label and determine which tool to test
  #
  # Runs when one of these labels is added to a non-draft PR opened from a
  # branch of this repository:
  #   test/install              — test the installation assistant (AIO)
  #   test/install-distributed  — test the installation assistant (Distributed)
  #   test/install-offline      — test the installation assistant (Offline)
  #   test/cert-tool            — test the certificates tool only
  #   test/passwords-tool       — test the passwords tool only
  #   test/assistant            — test all three tools in sequence (AIO, cert-tool, passwords-tool)
  # -------------------------------------------------------------------------
  get_pr_info:
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["test/install","test/install-distributed","test/install-offline","test/cert-tool","test/passwords-tool","test/assistant"]'), github.event.label.name)
    runs-on: ubuntu-24.04
    outputs:
      pr_number: ${{ steps.pr_data.outputs.pr_number }}
      pr_head_ref: ${{ steps.pr_data.outputs.pr_head_ref }}
      pr_head_sha: ${{ steps.pr_data.outputs.pr_head_sha }}
      tool_type: ${{ steps.parse_label.outputs.tool_type }}
      install_mode: ${{ steps.parse_label.outputs.install_mode }}

    steps:
      - name: Extract PR data
        id: pr_data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "pr_number=${PR_NUMBER}"     >> $GITHUB_OUTPUT
          echo "pr_head_ref=${PR_HEAD_REF}" >> $GITHUB_OUTPUT
          echo "pr_head_sha=${PR_HEAD_SHA}" >> $GITHUB_OUTPUT

      - name: Parse label and set test metadata
        id: parse_label
        env:
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          case "$LABEL_NAME" in
            test/install)
              echo 'tool_type=installer' >> $GITHUB_OUTPUT
              echo 'install_mode=aio' >> $GITHUB_OUTPUT
              ;;
            test/install-distributed)
              echo 'tool_type=installer' >> $GITHUB_OUTPUT
              echo 'install_mode=distributed' >> $GITHUB_OUTPUT
              ;;
            test/install-offline)
              echo 'tool_type=installer' >> $GITHUB_OUTPUT
              echo 'install_mode=offline' >> $GITHUB_OUTPUT
              ;;
            test/cert-tool)
              echo 'tool_type=cert-tool' >> $GITHUB_OUTPUT
              echo 'install_mode=aio' >> $GITHUB_OUTPUT
              ;;
            test/passwords-tool)
              echo 'tool_type=passwords-tool' >> $GITHUB_OUTPUT
              echo 'install_mode=aio' >> $GITHUB_OUTPUT
              ;;
            test/assistant)
              echo 'tool_type=all' >> $GITHUB_OUTPUT
              echo 'install_mode=aio' >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::Unsupported label: ${LABEL_NAME}"
              exit 1
              ;;
          esac

  # -------------------------------------------------------------------------
  # Job 2: Build tool(s) from the PR branch, generate presigned artifact
  #        URLs, and upload everything as a single artifact.
  # -------------------------------------------------------------------------
  build_tools:
    needs: get_pr_info
    if: |
      always() &&
      (needs.get_pr_info.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    outputs:
      tool_type: ${{ steps.ctx.outputs.tool_type }}
      install_mode: ${{ steps.ctx.outputs.install_mode }}
      package_type: ${{ steps.ctx.outputs.package_type }}
      pr_head_ref: ${{ steps.ctx.outputs.pr_head_ref }}
      wazuh_version: ${{ steps.version.outputs.wazuh_version }}
      matrix: ${{ steps.ctx.outputs.matrix }}

    steps:
      - name: Resolve context
        id: ctx
        env:
          PR_TOOL_TYPE: ${{ needs.get_pr_info.outputs.tool_type }}
          PR_INSTALL_MODE: ${{ needs.get_pr_info.outputs.install_mode }}
          PR_HEAD_REF: ${{ needs.get_pr_info.outputs.pr_head_ref }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tool_type=${{ inputs.tool_type }}"         >> $GITHUB_OUTPUT
            echo "install_mode=${{ inputs.install_mode }}"   >> $GITHUB_OUTPUT
            echo "package_type=${{ inputs.package_type }}"   >> $GITHUB_OUTPUT
            echo "pr_head_ref=${{ inputs.pr_head_ref }}"     >> $GITHUB_OUTPUT
            SYSTEMS_INPUT="${{ inputs.systems }}"
            if [ -z "$SYSTEMS_INPUT" ] || [ "$SYSTEMS_INPUT" = "all" ]; then
              echo "matrix=${ALL_SYSTEMS}" >> $GITHUB_OUTPUT
            else
              MATRIX=$(echo "$SYSTEMS_INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | jq -R . | jq -sc .)
              echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
            fi
          else
            echo "tool_type=${PR_TOOL_TYPE}"                                     >> $GITHUB_OUTPUT
            echo "install_mode=${PR_INSTALL_MODE}"                               >> $GITHUB_OUTPUT
            echo "package_type=staging"                                          >> $GITHUB_OUTPUT
            echo "pr_head_ref=${PR_HEAD_REF}"                                    >> $GITHUB_OUTPUT
            echo "matrix=${ALL_SYSTEMS}"                                         >> $GITHUB_OUTPUT
          fi

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ctx.outputs.pr_head_ref }}
          path: wazuh-installation-assistant

      - name: Checkout wazuh-automation
        uses: actions/checkout@v6
        with:
          repository: wazuh/wazuh-automation
          ref: ${{ env.AUTOMATION_REFERENCE }}
          token: ${{ secrets.GH_CLONE_TOKEN }}
          path: wazuh-automation

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get Wazuh version
        id: version
        run: |
          WAZUH_VERSION=$(jq -r '.version' wazuh-installation-assistant/VERSION.json)
          echo "wazuh_version=${WAZUH_VERSION}" >> $GITHUB_OUTPUT

      - name: Build tool(s)
        working-directory: wazuh-installation-assistant
        run: |
          TOOL_TYPE="${{ steps.ctx.outputs.tool_type }}"
          bash builder.sh -i
          if [ "$TOOL_TYPE" = "cert-tool" ] || [ "$TOOL_TYPE" = "all" ]; then
            bash builder.sh -c
          fi
          if [ "$TOOL_TYPE" = "passwords-tool" ] || [ "$TOOL_TYPE" = "all" ]; then
            bash builder.sh -p
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          role-session-name: assistant-build-${{ github.run_id }}
          aws-region: ${{ env.REGION }}

      - name: Generate presigned artifact URLs
        run: |
          pip install pyyaml --quiet
          python ${{ env.GENERATE_PRESIGNED_URLS_SCRIPT_PATH }} \
            --process test_assistant \
            --wazuh-version "${{ steps.version.outputs.wazuh_version }}" \
            --aws-s3-bucket-dev "${{ vars.AWS_S3_BUCKET_DEV }}"
          echo "Generated presigned URLs:"
          cat /tmp/artifact_urls.yaml

      - name: Stage built tools for artifact upload
        run: |
          mkdir -p /tmp/built-tools
          cp wazuh-installation-assistant/wazuh-install.sh /tmp/built-tools/
          cp /tmp/artifact_urls.yaml /tmp/built-tools/
          [ -f wazuh-installation-assistant/wazuh-certs-tool.sh ] && \
            cp wazuh-installation-assistant/wazuh-certs-tool.sh /tmp/built-tools/ || true
          [ -f wazuh-installation-assistant/wazuh-passwords-tool.sh ] && \
            cp wazuh-installation-assistant/wazuh-passwords-tool.sh /tmp/built-tools/ || true

      - name: Upload built tools and artifact URLs
        run: |
          aws s3 cp "/tmp/built-tools" "s3://${{ secrets.CI_DEV_INTERNAL_S3_BUCKET }}/wazuh-installation-assistant/5_check_integration_tools/${{ github.run_id }}/built-tools/" --recursive

  # -------------------------------------------------------------------------
  # Job 3: For each OS — provision VM, deploy tools, install, test, cleanup.
  # -------------------------------------------------------------------------
  vm_test:
    needs: [build_tools]
    if: always() && needs.build_tools.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.build_tools.outputs.matrix) }}

    steps:
      # -----------------------------------------------------------------------
      # Setup
      # -----------------------------------------------------------------------
      - name: Checkout wazuh-automation
        uses: actions/checkout@v6
        with:
          repository: wazuh/wazuh-automation
          ref: ${{ env.AUTOMATION_REFERENCE }}
          token: ${{ secrets.GH_CLONE_TOKEN }}
          path: wazuh-automation

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install requirements
        run: |
          pip install -r wazuh-automation/deployability/deps/requirements.txt
          pip install -r wazuh-automation/integration-test-module/requirements.txt
          pip install -e wazuh-automation/integration-test-module/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          role-session-name: assistant-vm-test-${{ github.run_id }}
          aws-region: ${{ env.REGION }}

      # -----------------------------------------------------------------------
      # Provision: use allocator and extract SSH credentials
      # -----------------------------------------------------------------------
      - name: Allocate instance
        id: allocate
        run: |
          mkdir -p ${{ env.ALLOCATOR_PATH }}
          python3 wazuh-automation/deployability/modules/allocation/main.py \
            --action create \
            --provider aws \
            --size xlarge \
            --composite-name ${{ matrix.system }} \
            --working-dir ${{ env.ALLOCATOR_PATH }} \
            --track-output ${{ env.ALLOCATOR_PATH }}/track.yml \
            --inventory-output ${{ env.ALLOCATOR_PATH }}/inventory.yml \
            --instance-name gha_${{ github.run_id }}_${{ matrix.system }}_tool_check \
            --label-team devops \
            --label-termination-date 1d

          sed -n '/hosts:/,/^[^ ]/p' ${{ env.ALLOCATOR_PATH }}/inventory.yml \
            | grep "ansible_" \
            | sed 's/^[ ]*//g' \
            > ${{ env.ALLOCATOR_PATH }}/inventory_vars_raw.yml
          sed 's/: */=/g' ${{ env.ALLOCATOR_PATH }}/inventory_vars_raw.yml \
            > ${{ env.ALLOCATOR_PATH }}/inventory_vars.yml
          sed -i 's/-o StrictHostKeyChecking=no/"-o StrictHostKeyChecking=no"/g' \
            ${{ env.ALLOCATOR_PATH }}/inventory_vars.yml

      - name: Set SSH credentials from inventory
        run: |
          find ${{ env.ALLOCATOR_PATH }} -name '*-key-*' -exec chmod 600 {} \;
          source ${{ env.ALLOCATOR_PATH }}/inventory_vars.yml
          echo "SSH_HOST=$ansible_host"                >> $GITHUB_ENV
          echo "SSH_PORT=$ansible_port"                >> $GITHUB_ENV
          echo "SSH_USER=$ansible_user"                >> $GITHUB_ENV
          echo "SSH_KEY=$ansible_ssh_private_key_file" >> $GITHUB_ENV
          # Address agents dial: -g adds it to the agent listener certificate with -as
          [ -n "${ansible_host_private_ip:-}" ] || { echo 'ERROR: no private IP in the allocator inventory'; exit 1; }
          echo "PRIVATE_IP=$ansible_host_private_ip"   >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Deploy: copy built tools and artifact URLs to remote instance
      # -----------------------------------------------------------------------
      - name: Download built tools
        run: |
          aws s3 cp "s3://${{ secrets.CI_DEV_INTERNAL_S3_BUCKET }}/wazuh-installation-assistant/5_check_integration_tools/${{ github.run_id }}/built-tools/" "/tmp/built-tools/" --recursive


      - name: Set SSH/SCP helper env vars
        run: |
          echo "SSH_OPTS=-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=20 -p ${{ env.SSH_PORT }} -i ${{ env.SSH_KEY }}" >> $GITHUB_ENV
          echo "SCP_OPTS=-o StrictHostKeyChecking=no -P ${{ env.SSH_PORT }} -i ${{ env.SSH_KEY }}" >> $GITHUB_ENV
          echo "REMOTE=${{ env.SSH_USER }}@${{ env.SSH_HOST }}" >> $GITHUB_ENV
          if [ "${{ needs.build_tools.outputs.package_type }}" = "staging" ]; then
            echo "DEV_FLAG=-d local" >> $GITHUB_ENV
          else
            echo "DEV_FLAG=" >> $GITHUB_ENV
          fi

      - name: Copy tool(s) to remote instance
        run: |
          TOOL_TYPE="${{ needs.build_tools.outputs.tool_type }}"
          DEST="${{ env.REMOTE }}:/tmp"
          scp ${{ env.SCP_OPTS }} /tmp/built-tools/wazuh-install.sh ${DEST}/wazuh-install.sh
          if [ "$TOOL_TYPE" = "cert-tool" ] || [ "$TOOL_TYPE" = "all" ]; then
            scp ${{ env.SCP_OPTS }} /tmp/built-tools/wazuh-certs-tool.sh ${DEST}/wazuh-certs-tool.sh
          fi
          if [ "$TOOL_TYPE" = "passwords-tool" ] || [ "$TOOL_TYPE" = "all" ]; then
            scp ${{ env.SCP_OPTS }} /tmp/built-tools/wazuh-passwords-tool.sh ${DEST}/wazuh-passwords-tool.sh
          fi
          scp ${{ env.SCP_OPTS }} /tmp/built-tools/artifact_urls.yaml ${DEST}/artifact_urls.yaml

      - name: Create config.yml and copy to remote instance
        if: |
          needs.build_tools.outputs.install_mode == 'distributed' ||
          needs.build_tools.outputs.tool_type == 'cert-tool' ||
          needs.build_tools.outputs.tool_type == 'all'
        run: |
          cat > /tmp/config.yml <<'EOF'
          nodes:
            indexer:
              - name: indexer
                ip: 127.0.0.1
            manager:
              - name: manager
                ip: 127.0.0.1
            dashboard:
              - name: dashboard
                ip: 127.0.0.1
          EOF
          scp ${{ env.SCP_OPTS }} /tmp/config.yml "${{ env.REMOTE }}:/tmp/config.yml"

      # -----------------------------------------------------------------------
      # Install with assistant AIO
      # -----------------------------------------------------------------------
      - name: Run installer (AIO)
        if: |
          needs.build_tools.outputs.install_mode == 'aio' ||
          (needs.build_tools.outputs.tool_type != 'installer' &&
           needs.build_tools.outputs.tool_type != 'all')
        timeout-minutes: 60
        run: |
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" "
            { while true; do echo \"\$(date '+%H:%M:%S') [heartbeat] AIO installation in progress...\"; sleep 60; done } &
            HB=\$!
            sudo bash /tmp/wazuh-install.sh -a ${{ env.DEV_FLAG }} -id 2>&1 | tee /tmp/install-aio.log
            RESULT=\${PIPESTATUS[0]}
            kill \$HB 2>/dev/null || true
            [ \$RESULT -ne 0 ] && { echo '--- Last 50 lines of install log ---'; tail -50 /tmp/install-aio.log; }
            exit \$RESULT
          "

      # -----------------------------------------------------------------------
      # Install with assistant Distributed
      # -----------------------------------------------------------------------

      - name: Run installer (Distributed)
        if: needs.build_tools.outputs.install_mode == 'distributed'
        timeout-minutes: 60
        run: |
          # Generate install files (certificates + config) from config.yml. config.yml keeps the
          # nodes on 127.0.0.1, so the services listen on localhost, and -as adds the address agents
          # dial to the agent listener certificate, which -g refuses to issue for loopback only.
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" "
            { while true; do echo \"\$(date '+%H:%M:%S') [heartbeat] Generating certificates and config...\"; sleep 60; done } &
            HB=\$!
            sudo bash /tmp/wazuh-install.sh -g -as ${{ env.PRIVATE_IP }} -id 2>&1 | tee /tmp/install-g.log
            RESULT=\${PIPESTATUS[0]}; kill \$HB 2>/dev/null || true
            [ \$RESULT -ne 0 ] && { echo '--- Last 50 lines ---'; tail -50 /tmp/install-g.log; }
            exit \$RESULT
          "
          # The tar carries the credentials file and not the root CA key, and the agent listener
          # certificate names the address agents dial
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" '
            members=$(sudo tar -tf /tmp/wazuh-install-files.tar) || exit 1
            grep -qx "wazuh-install-files/credentials.env" <<< "$members" || { echo "ERROR: credentials.env missing from wazuh-install-files.tar"; exit 1; }
            if grep -q "root-ca.key" <<< "$members"; then echo "ERROR: root-ca.key must not be in wazuh-install-files.tar"; exit 1; fi
            sudo tar -xOf /tmp/wazuh-install-files.tar wazuh-install-files/manager-remoted.pem | openssl x509 -noout -ext subjectAltName \
              | tr "," "\n" | sed "s/^ *//" | grep -qx "IP Address:${{ env.PRIVATE_IP }}" \
              || { echo "ERROR: the agent listener certificate does not name ${{ env.PRIVATE_IP }}"; exit 1; }
            echo "wazuh-install-files.tar: credentials.env present, root-ca.key absent, agent listener certificate names ${{ env.PRIVATE_IP }}"
          '
          # Install indexer
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" "
            { while true; do echo \"\$(date '+%H:%M:%S') [heartbeat] Installing wazuh-indexer...\"; sleep 60; done } &
            HB=\$!
            sudo bash /tmp/wazuh-install.sh -wi indexer ${{ env.DEV_FLAG }} -id 2>&1 | tee /tmp/install-wi.log
            RESULT=\${PIPESTATUS[0]}; kill \$HB 2>/dev/null || true
            [ \$RESULT -ne 0 ] && { echo '--- Last 50 lines ---'; tail -50 /tmp/install-wi.log; }
            exit \$RESULT
          "
          # Initialize indexer cluster security settings
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" "
            { while true; do echo \"\$(date '+%H:%M:%S') [heartbeat] Initializing indexer security...\"; sleep 60; done } &
            HB=\$!
            sudo bash /tmp/wazuh-install.sh -s 2>&1 | tee /tmp/install-s.log
            RESULT=\${PIPESTATUS[0]}; kill \$HB 2>/dev/null || true
            [ \$RESULT -ne 0 ] && { echo '--- Last 50 lines ---'; tail -50 /tmp/install-s.log; }
            exit \$RESULT
          "
          # Install manager
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" "
            { while true; do echo \"\$(date '+%H:%M:%S') [heartbeat] Installing wazuh-manager...\"; sleep 60; done } &
            HB=\$!
            sudo bash /tmp/wazuh-install.sh -wm manager ${{ env.DEV_FLAG }} -id 2>&1 | tee /tmp/install-wm.log
            RESULT=\${PIPESTATUS[0]}; kill \$HB 2>/dev/null || true
            [ \$RESULT -ne 0 ] && { echo '--- Last 50 lines ---'; tail -50 /tmp/install-wm.log; }
            exit \$RESULT
          "
          # Install dashboard
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" "
            { while true; do echo \"\$(date '+%H:%M:%S') [heartbeat] Installing wazuh-dashboard...\"; sleep 60; done } &
            HB=\$!
            sudo bash /tmp/wazuh-install.sh -wd dashboard ${{ env.DEV_FLAG }} -id 2>&1 | tee /tmp/install-wd.log
            RESULT=\${PIPESTATUS[0]}; kill \$HB 2>/dev/null || true
            [ \$RESULT -ne 0 ] && { echo '--- Last 50 lines ---'; tail -50 /tmp/install-wd.log; }
            exit \$RESULT
          "

      # -----------------------------------------------------------------------
      # Install with assistant Offline
      # -----------------------------------------------------------------------

      - name: Detect package type and arch for offline download (Offline installation)
        if: needs.build_tools.outputs.install_mode == 'offline'
        run: |
          SYSTEM="${{ matrix.system }}"
          case "$SYSTEM" in
            ubuntu-*) PKG_TYPE="deb" ;;
            *)        PKG_TYPE="rpm" ;;
          esac
          if [ "$PKG_TYPE" = "rpm" ]; then
            case "$SYSTEM" in
              *-arm64) ARCH="aarch64" ;;
              *)       ARCH="x86_64"  ;;
            esac
          else
            case "$SYSTEM" in
              *-arm64) ARCH="arm64" ;;
              *)       ARCH="amd64" ;;
            esac
          fi
          echo "PKG_TYPE=$PKG_TYPE" >> $GITHUB_ENV
          echo "ARCH=$ARCH"         >> $GITHUB_ENV

      - name: Install offline prerequisites on remote instance (Offline installation)
        if: needs.build_tools.outputs.install_mode == 'offline'
        run: |
          if [ "${{ env.PKG_TYPE }}" = "deb" ]; then
            ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" \
              "sudo apt-get update -q && sudo apt-get install -y debconf adduser procps gnupg apt-transport-https tar curl libcap2-bin gawk"
          else
            SYSTEM="${{ matrix.system }}"
            case "$SYSTEM" in
              amazon-2023-*)
                # AL2023 does not ship yum-utils; dnf-utils provides the equivalent
                # and registers as yum-utils in the RPM database for installer checks.
                ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" \
                  "sudo dnf install -y coreutils libcap dnf-utils lsof gawk"
                ;;
              *)
                ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" \
                  "sudo dnf install -y coreutils libcap lsof gawk"
                ;;
            esac
          fi

      - name: Download offline packages on runner (Offline installation)
        if: needs.build_tools.outputs.install_mode == 'offline'
        run: |
          cd /tmp/built-tools
          sudo bash wazuh-install.sh -dw "${{ env.PKG_TYPE }}" -da "${{ env.ARCH }}" ${{ env.DEV_FLAG }} -id
          sudo chmod 644 wazuh-offline.tar.gz

      # The offline all-in-one install (-a -of) does not use wazuh-install-files.tar nor
      # config.yml: the packages create the root CA, the certificates and the passwords.
      - name: Copy all offline files to remote instance (Offline installation)
        if: needs.build_tools.outputs.install_mode == 'offline'
        run: |
          scp ${{ env.SCP_OPTS }} \
            /tmp/built-tools/wazuh-install.sh \
            /tmp/built-tools/wazuh-offline.tar.gz \
            /tmp/built-tools/artifact_urls.yaml \
            "${{ env.REMOTE }}:/tmp/"

      - name: Remove internet access from instance (Offline installation)
        if: needs.build_tools.outputs.install_mode == 'offline'
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=gha_${{ github.run_id }}_${{ matrix.system }}_tool_check" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text --region ${{ env.REGION }})
          echo "Switching instance $INSTANCE_ID to no-internet SG (${{ env.SG_NO_INTERNET }})"
          aws ec2 modify-instance-attribute \
            --instance-id "$INSTANCE_ID" \
            --groups "${{ env.SG_NO_INTERNET }}" \
            --region ${{ env.REGION }}

      - name: Run installer (Offline installation)
        if: needs.build_tools.outputs.install_mode == 'offline'
        timeout-minutes: 60
        run: |
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" "
            { while true; do echo \"\$(date '+%H:%M:%S') [heartbeat] Offline installation in progress...\"; sleep 60; done } &
            HB=\$!
            cd /tmp && sudo bash /tmp/wazuh-install.sh -a -of 2>&1 | tee /tmp/install-offline.log
            RESULT=\${PIPESTATUS[0]}
            kill \$HB 2>/dev/null || true
            [ \$RESULT -ne 0 ] && { echo '--- Last 50 lines of install log ---'; tail -50 /tmp/install-offline.log; }
            exit \$RESULT
          "

      # -----------------------------------------------------------------------
      # Wait for wazuh-dashboard to be ready
      # -----------------------------------------------------------------------
      - name: Wait for wazuh-dashboard
        if: |
          needs.build_tools.outputs.tool_type == 'installer' ||
          needs.build_tools.outputs.tool_type == 'all'
        timeout-minutes: 5
        run: |
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" "
            # The packages and the assistant keep everything in the directory of each package.
            sudo test -e /etc/wazuh && { echo 'ERROR: /etc/wazuh exists'; exit 1; }
            ADMIN_PW=\$(sudo grep '^WAZUH_INDEXER_ADMIN_PASSWORD=' /etc/wazuh-indexer/export/credentials.env | tail -n 1 | cut -d= -f2- | tr -d '\"')
            [ -n \"\$ADMIN_PW\" ] || { echo 'ERROR: WAZUH_INDEXER_ADMIN_PASSWORD not found in /etc/wazuh-indexer/export/credentials.env'; exit 1; }
            for i in \$(seq 1 30); do
              code=\$(curl -sk -u \"admin:\${ADMIN_PW}\" -o /dev/null -w '%{http_code}' 'https://localhost/status')
              [ \"\$code\" = '200' ] && { echo 'wazuh-dashboard is ready'; exit 0; }
              echo \"  attempt \$i: HTTP \$code, retrying in 10s...\"
              sleep 10
            done
            echo 'ERROR: wazuh-dashboard not ready after 5 minutes'
            exit 1
          "

      # -----------------------------------------------------------------------
      # Run cert-tool
      # -----------------------------------------------------------------------
      - name: Run cert-tool
        if: |
          needs.build_tools.outputs.tool_type == 'cert-tool' ||
          needs.build_tools.outputs.tool_type == 'all'
        run: |
          scp ${{ env.SCP_OPTS }} /tmp/config.yml "${{ env.REMOTE }}:/tmp/config.yml"
          # The tool refuses to write into a wazuh-certificates directory that is not empty, and the
          # tests check the output of this run only
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" \
            "sudo rm -rf /tmp/wazuh-certificates && sudo bash /tmp/wazuh-certs-tool.sh -A"

      # -----------------------------------------------------------------------
      # Run passwords-tool
      # -----------------------------------------------------------------------
      - name: Run passwords-tool
        if: |
          needs.build_tools.outputs.tool_type == 'passwords-tool' ||
          needs.build_tools.outputs.tool_type == 'all'
        env:
          WAZUH_NEW_PASSWORD: "T3sting-Password"
        run: |
          # Keep the admin password set by the installer, the tests check that it is rejected afterwards.
          # The value may be quoted or bare, depending on who wrote the file.
          OLD_ADMIN_PW=$(ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" \
            "sudo grep '^WAZUH_INDEXER_ADMIN_PASSWORD=' /etc/wazuh-indexer/export/credentials.env | tail -n 1 | cut -d= -f2- | tr -d '\"'")
          [ -n "$OLD_ADMIN_PW" ] || { echo 'ERROR: WAZUH_INDEXER_ADMIN_PASSWORD not found in /etc/wazuh-indexer/export/credentials.env'; exit 1; }
          echo "::add-mask::${OLD_ADMIN_PW}"
          echo "WAZUH_OLD_PASSWORD=${OLD_ADMIN_PW}" >> "$GITHUB_ENV"
          # Without -p the tool generates the password and saves it to the indexer export/credentials.env
          read_credential() {
            ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" \
              "sudo grep '^$1=' /etc/wazuh-indexer/export/credentials.env | tail -n 1 | cut -d= -f2- | tr -d '\"'"
          }
          kibanaserver_http_code() {
            ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" \
              "curl -sk -u 'kibanaserver:$1' -o /dev/null -w '%{http_code}' 'https://localhost:9200/_cluster/health'"
          }
          KIBANASERVER_PW=$(read_credential WAZUH_INDEXER_KIBANASERVER_PASSWORD)
          [ -n "$KIBANASERVER_PW" ] || { echo 'ERROR: WAZUH_INDEXER_KIBANASERVER_PASSWORD not found in /etc/wazuh-indexer/export/credentials.env'; exit 1; }
          echo "::add-mask::${KIBANASERVER_PW}"
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" "sudo bash /tmp/wazuh-passwords-tool.sh -u kibanaserver" \
            || { echo 'ERROR: the passwords tool failed to generate a password for kibanaserver'; exit 1; }
          GENERATED_PW=$(read_credential WAZUH_INDEXER_KIBANASERVER_PASSWORD)
          [ -n "$GENERATED_PW" ] && echo "::add-mask::${GENERATED_PW}"
          [ -n "$GENERATED_PW" ] && [ "$GENERATED_PW" != "$KIBANASERVER_PW" ] \
            || { echo 'ERROR: the password generated for kibanaserver was not saved to /etc/wazuh-indexer/export/credentials.env'; exit 1; }
          # The indexer can take a few seconds to apply the change, so each check waits up to 2 minutes
          wait_kibanaserver_http_code() {
            for _ in $(seq 1 24); do
              code=$(kibanaserver_http_code "$1") || true
              [ "$code" = "$2" ] && return 0
              sleep 5
            done
            return 1
          }
          wait_kibanaserver_http_code "$GENERATED_PW" 200 \
            || { echo "ERROR: the generated kibanaserver password is rejected after 2 minutes (HTTP ${code})"; exit 1; }
          wait_kibanaserver_http_code "$KIBANASERVER_PW" 401 \
            || { echo "ERROR: the previous kibanaserver password is still accepted after 2 minutes (HTTP ${code})"; exit 1; }
          echo "The password generated for kibanaserver is saved to the indexer export/credentials.env and replaces the previous one"
          # The passwords tool reads the new password from the standard input with -p
          for user in admin kibanaserver wazuh-manager wazuh wazuh-internal-client; do
            printf '%s\n' "$WAZUH_NEW_PASSWORD" | ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" \
              "sudo bash /tmp/wazuh-passwords-tool.sh -u ${user} -p"
          done
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" \
            "sudo systemctl restart wazuh-indexer wazuh-dashboard wazuh-manager"

      - name: Wait for services to be ready after password changes
        if: |
          needs.build_tools.outputs.tool_type == 'passwords-tool' ||
          needs.build_tools.outputs.tool_type == 'all'
        env:
          WAZUH_NEW_PASSWORD: "T3sting-Password"
        run: |
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" "
          NEW_PW='${{ env.WAZUH_NEW_PASSWORD }}'
          RETRIES=30

          echo 'Waiting for wazuh-indexer to accept new admin credentials...'
          for i in \$(seq 1 \$RETRIES); do
            code=\$(curl -sk -u \"admin:\${NEW_PW}\" -o /dev/null -w '%{http_code}' 'https://localhost:9200/_cluster/health?pretty')
            [ \"\$code\" = '200' ] && break
            echo \"  attempt \$i: HTTP \$code, retrying in 10s...\"
            sleep 10
          done
          [ \"\$code\" = '200' ] || { echo 'ERROR: indexer not accepting new credentials after 3 minutes'; exit 1; }
          echo 'wazuh-indexer is ready'

          echo 'Waiting for wazuh-dashboard to accept new admin credentials...'
          for i in \$(seq 1 \$RETRIES); do
            code=\$(curl -sk -u \"admin:\${NEW_PW}\" -o /dev/null -w '%{http_code}' 'https://localhost/status')
            [ \"\$code\" = '200' ] && break
            echo \"  attempt \$i: HTTP \$code, retrying in 10s...\"
            sleep 10
          done
          [ \"\$code\" = '200' ] || { echo 'ERROR: dashboard not accepting new credentials after 3 minutes'; exit 1; }
          echo 'wazuh-dashboard is ready'

          echo 'Waiting for wazuh-manager API to accept wazuh-internal-client credentials...'
          for i in \$(seq 1 \$RETRIES); do
            code=\$(curl -sk -X POST -u \"wazuh-internal-client:\${NEW_PW}\" -o /dev/null -w '%{http_code}' 'https://localhost:55000/security/user/authenticate')
            [ \"\$code\" = '200' ] && break
            echo \"  attempt \$i: HTTP \$code, retrying in 10s...\"
            sleep 10
          done
          [ \"\$code\" = '200' ] || { echo 'ERROR: manager API not accepting wazuh-internal-client credentials after 3 minutes'; exit 1; }
          echo 'wazuh-manager API is ready'
          "

      # -----------------------------------------------------------------------
      # Run integration tests and generate results
      # -----------------------------------------------------------------------
      - name: Run tests
        id: run_tests
        continue-on-error: true
        env:
          WAZUH_NEW_PASSWORD: ${{ (needs.build_tools.outputs.tool_type == 'passwords-tool' || needs.build_tools.outputs.tool_type == 'all') && 'T3sting-Password' || '' }}
          WAZUH_SERVICE_PASSWORD: ${{ (needs.build_tools.outputs.tool_type == 'passwords-tool' || needs.build_tools.outputs.tool_type == 'all') && 'T3sting-Password' || '' }}
          WAZUH_CERT_TOOL_OUTPUT_DIR: /tmp/wazuh-certificates
          # The node certificates carry the node names of config.yml with -g and the host name with -a
          WAZUH_INSTALL_MODE: ${{ needs.build_tools.outputs.install_mode }}
        run: |
          TOOL_TYPE="${{ needs.build_tools.outputs.tool_type }}"
          OS="${{ matrix.system }}"
          # Expected version: the one of the branch under test, not the default of wazuh-automation
          EXPECTED_VERSION="${{ needs.build_tools.outputs.wazuh_version }}"
          [ -n "$EXPECTED_VERSION" ] || { echo 'ERROR: no Wazuh version from VERSION.json'; exit 1; }
          if [ "${{ needs.build_tools.outputs.package_type }}" = "staging" ]; then
            EXPECTED_VERSION="${EXPECTED_VERSION}-latest"
          fi
          export WAZUH_MANAGER_EXPECTED_VERSION="$EXPECTED_VERSION"
          export WAZUH_INDEXER_EXPECTED_VERSION="$EXPECTED_VERSION"
          export WAZUH_DASHBOARD_EXPECTED_VERSION="$EXPECTED_VERSION"
          test_runner \
            --test-type "$TOOL_TYPE" \
            --ssh-host "${{ env.SSH_HOST }}" \
            --ssh-port "${{ env.SSH_PORT }}" \
            --ssh-key-path "${{ env.SSH_KEY }}" \
            --ssh-username "${{ env.SSH_USER }}" \
            --log-level INFO \
            --output github \
            --output-file "test-results-${OS}.github"

      - name: Uninstall Wazuh
        if: |
          always() && (
            needs.build_tools.outputs.tool_type == 'installer' ||
            needs.build_tools.outputs.tool_type == 'all'
          )
        timeout-minutes: 30
        run: |
          ssh ${{ env.SSH_OPTS }} "${{ env.REMOTE }}" "
            { while true; do echo \"\$(date '+%H:%M:%S') [heartbeat] Uninstall in progress...\"; sleep 30; done } &
            HB=\$!
            sudo bash /tmp/wazuh-install.sh --uninstall 2>&1 | tee /tmp/install-uninstall.log
            RESULT=\${PIPESTATUS[0]}
            kill \$HB 2>/dev/null || true
            [ \$RESULT -ne 0 ] && { echo '--- Last 50 lines ---'; tail -50 /tmp/install-uninstall.log; }
            exit \$RESULT
          "

      - name: Run tests (uninstall)
        id: run_tests_uninstall
        if: |
          always() && (
            needs.build_tools.outputs.tool_type == 'installer' ||
            needs.build_tools.outputs.tool_type == 'all'
          )
        continue-on-error: true
        run: |
          OS="${{ matrix.system }}"
          test_runner \
            --test-type uninstall \
            --ssh-host "${{ env.SSH_HOST }}" \
            --ssh-port "${{ env.SSH_PORT }}" \
            --ssh-key-path "${{ env.SSH_KEY }}" \
            --ssh-username "${{ env.SSH_USER }}" \
            --log-level INFO \
            --output github \
            --output-file "test-results-${OS}-uninstall.github"

      - name: Create step summary
        if: always()
        run: |
          TOOL="${{ needs.build_tools.outputs.tool_type }}"
          MODE="${{ needs.build_tools.outputs.install_mode }}"
          OS="${{ matrix.system }}"
          echo "## 🧪 Integration Test Results — ${TOOL} [${MODE}] on ${OS}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "test-results-${OS}.github" ]; then
            cat "test-results-${OS}.github" >> $GITHUB_STEP_SUMMARY
          else
            echo "No test results file found." >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "test-results-${OS}-uninstall.github" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Uninstall" >> $GITHUB_STEP_SUMMARY
            cat "test-results-${OS}-uninstall.github" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post PR comment with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          TOOL: ${{ needs.build_tools.outputs.tool_type }}
          INSTALL_MODE: ${{ needs.build_tools.outputs.install_mode }}
          OS: ${{ matrix.system }}
          RUN_OUTCOME: ${{ steps.run_tests.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const tool = process.env.TOOL;
            const mode = process.env.INSTALL_MODE;
            const os = process.env.OS;
            const outcome = process.env.RUN_OUTCOME;
            const marker = `<!-- integration-check-${tool}-${mode}-${os} -->`;

            let body = `${marker}\n## 🧪 Integration Tests — \`${tool}\` [\`${mode}\`] on \`${os}\`\n\n`;
            body += outcome === 'success'
              ? '✅ **All tests passed!**\n\n'
              : '❌ **Some tests failed**\n\n';

            const resultsFile = `test-results-${os}.github`;
            try {
              if (fs.existsSync(resultsFile)) {
                body += '### Results\n\n' + fs.readFileSync(resultsFile, 'utf8') + '\n\n';
              }
            } catch (e) {
              console.log('Could not read results file:', e.message);
            }
            const uninstallFile = `test-results-${os}-uninstall.github`;
            try {
              if (fs.existsSync(uninstallFile)) {
                body += '### Uninstall\n\n' + fs.readFileSync(uninstallFile, 'utf8') + '\n\n';
              }
            } catch (e) {
              console.log('Could not read uninstall results file:', e.message);
            }

            body += `- **Workflow:** [View Details](${context.payload.repository.html_url}/actions/runs/${context.runId})\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload test results
        if: always()
        run: |
          for f in test-results-${{ matrix.system }}*.github; do
            [ -f "$f" ] && aws s3 cp "$f" "s3://${{ secrets.CI_DEV_INTERNAL_S3_BUCKET }}/wazuh-installation-assistant/5_check_integration_tools/${{ github.run_id }}/$f"
          done

      # -----------------------------------------------------------------------
      # Cleanup: always deallocate instance with allocator
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials for cleanup
        if: always()
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          role-session-name: assistant-cleanup-${{ github.run_id }}
          aws-region: ${{ env.REGION }}

      - name: Deallocate instance
        if: always()
        run: |
          python3 wazuh-automation/deployability/modules/allocation/main.py \
            --action delete \
            --track-output ${{ env.ALLOCATOR_PATH }}/track.yml

      # The test steps continue on error so that the results are reported and the instance is
      # deallocated; this step makes the job, and so the check of the PR, fail when a test failed.
      - name: Fail the job when a test failed
        if: always() && (steps.run_tests.outcome == 'failure' || steps.run_tests_uninstall.outcome == 'failure')
        run: |
          echo "Integration tests failed: run_tests=${{ steps.run_tests.outcome }}, run_tests_uninstall=${{ steps.run_tests_uninstall.outcome }}"
          exit 1

  # -------------------------------------------------------------------------
  # Job 4: All-in-one installation on a host with firewalld enabled.
  #
  # The Wazuh server runs on a RHEL host with firewalld enabled and the
  # agent on another host, so the traffic goes through the firewall (the
  # tests of vm_test run on the host itself, over the loopback interface,
  # which firewalld does not filter). The ports must be closed before they
  # are opened as the documentation says, and open after: an agent enrolls
  # and the Wazuh dashboard answers.
  # -------------------------------------------------------------------------
  firewall_check:
    needs: [build_tools]
    if: |
      always() && needs.build_tools.result == 'success' &&
      needs.build_tools.outputs.install_mode == 'aio' &&
      (needs.build_tools.outputs.tool_type == 'installer' || needs.build_tools.outputs.tool_type == 'all')
    runs-on: ubuntu-24.04
    env:
      SERVER_SYSTEM: redhat-9-amd64
      AGENT_SYSTEM: ubuntu-24-amd64
      AGENT_NAME: firewall-check-agent
      # Ports an agent and a user reach from another host (requirements and firewall warning)
      FIREWALL_PORTS: '443 1514 1515 1517'
      # The check is meaningless if these ports are not listening on the server
      FIREWALL_REQUIRED_PORTS: '443 1517'
      RESULTS_FILE: firewall-check-results.md

    steps:
      # -----------------------------------------------------------------------
      # Setup
      # -----------------------------------------------------------------------
      - name: Checkout wazuh-automation
        uses: actions/checkout@v6
        with:
          repository: wazuh/wazuh-automation
          ref: ${{ env.AUTOMATION_REFERENCE }}
          token: ${{ secrets.GH_CLONE_TOKEN }}
          path: wazuh-automation

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install requirements
        run: |
          pip install -r wazuh-automation/deployability/deps/requirements.txt
          pip install pyyaml --quiet

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          role-session-name: assistant-firewall-${{ github.run_id }}
          aws-region: ${{ env.REGION }}

      # -----------------------------------------------------------------------
      # Provision: one instance for the Wazuh server and one for the agent
      # -----------------------------------------------------------------------
      - name: Allocate instances
        run: |
          allocate() {
            local role="$1" system="$2" size="$3" dir="/tmp/allocator_${1,,}"
            mkdir -p "$dir"
            python3 wazuh-automation/deployability/modules/allocation/main.py \
              --action create \
              --provider aws \
              --size "$size" \
              --composite-name "$system" \
              --working-dir "$dir" \
              --track-output "$dir/track.yml" \
              --inventory-output "$dir/inventory.yml" \
              --instance-name "gha_${{ github.run_id }}_${system}_firewall_${role,,}" \
              --label-team devops \
              --label-termination-date 1d
            sed -n '/hosts:/,/^[^ ]/p' "$dir/inventory.yml" | grep "ansible_" | sed 's/^[ ]*//g' \
              | sed 's/: */=/g' | sed 's/-o StrictHostKeyChecking=no/"-o StrictHostKeyChecking=no"/g' \
              > "$dir/inventory_vars.yml"
            find "$dir" -name '*-key-*' -exec chmod 600 {} \;
            (
              source "$dir/inventory_vars.yml"
              [ -n "${ansible_host_private_ip:-}" ] || { echo "ERROR: no private IP in the allocator inventory of the ${role,,}"; exit 1; }
              echo "${role}_SSH_PORT=$ansible_port" >> "$GITHUB_ENV"
              echo "${role}_PRIVATE_IP=$ansible_host_private_ip" >> "$GITHUB_ENV"
              echo "${role}_SSH_OPTS=-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=20 -p $ansible_port -i $ansible_ssh_private_key_file" >> "$GITHUB_ENV"
              echo "${role}_SCP_OPTS=-o StrictHostKeyChecking=no -P $ansible_port -i $ansible_ssh_private_key_file" >> "$GITHUB_ENV"
              echo "${role}_REMOTE=$ansible_user@$ansible_host" >> "$GITHUB_ENV"
            )
          }
          allocate SERVER "${{ env.SERVER_SYSTEM }}" xlarge
          allocate AGENT "${{ env.AGENT_SYSTEM }}" small

      - name: Set helpers and package flag
        run: |
          # Helpers sourced by the next steps: run a command on each host and record a result
          cat > /tmp/firewall_helpers.sh <<'HELPERS'
          on_server() { ssh $SERVER_SSH_OPTS "$SERVER_REMOTE" "$@"; }
          on_agent() { ssh $AGENT_SSH_OPTS "$AGENT_REMOTE" "$@"; }
          pass() { echo "- ✅ $*" | tee -a "$RESULTS_FILE"; }
          fail() { echo "- ❌ $*" | tee -a "$RESULTS_FILE"; exit 1; }
          # Returns 0 if the agent host opens a TCP connection to the port of the server
          agent_reaches() { on_agent "timeout 5 bash -c '</dev/tcp/${SERVER_PRIVATE_IP}/$1'" 2>/dev/null; }
          HELPERS
          : > "$RESULTS_FILE"
          if [ "${{ needs.build_tools.outputs.package_type }}" = "staging" ]; then
            echo "DEV_FLAG=-d local" >> $GITHUB_ENV
          else
            echo "DEV_FLAG=" >> $GITHUB_ENV
          fi

      # -----------------------------------------------------------------------
      # Enable firewalld on the server, as RHEL does on a new installation
      # -----------------------------------------------------------------------
      - name: Enable firewalld on the server
        run: |
          source /tmp/firewall_helpers.sh
          # The allocator serves SSH on another port than 22, the only one the default zone allows
          on_server "
            set -e
            sudo dnf install -y firewalld
            if systemctl is-active -q firewalld; then
              sudo firewall-cmd --permanent --add-port=${SERVER_SSH_PORT}/tcp
              sudo firewall-cmd --reload
            else
              sudo firewall-offline-cmd --add-port=${SERVER_SSH_PORT}/tcp
              sudo systemctl enable --now firewalld
            fi
          "
          on_server "sudo firewall-cmd --state && sudo firewall-cmd --list-all" \
            && pass "firewalld is running on the server (${{ env.SERVER_SYSTEM }})" \
            || fail "firewalld is not running on the server"

      # -----------------------------------------------------------------------
      # Install with assistant AIO
      # -----------------------------------------------------------------------
      - name: Run installer (AIO)
        id: install
        timeout-minutes: 60
        run: |
          source /tmp/firewall_helpers.sh
          aws s3 cp "s3://${{ secrets.CI_DEV_INTERNAL_S3_BUCKET }}/wazuh-installation-assistant/5_check_integration_tools/${{ github.run_id }}/built-tools/" "/tmp/built-tools/" --recursive
          scp $SERVER_SCP_OPTS /tmp/built-tools/wazuh-install.sh /tmp/built-tools/artifact_urls.yaml "$SERVER_REMOTE:/tmp/"
          on_server "
            { while true; do echo \"\$(date '+%H:%M:%S') [heartbeat] AIO installation in progress...\"; sleep 60; done } &
            HB=\$!
            sudo bash /tmp/wazuh-install.sh -a ${{ env.DEV_FLAG }} -id 2>&1 | tee /tmp/install-aio.log
            RESULT=\${PIPESTATUS[0]}
            kill \$HB 2>/dev/null || true
            [ \$RESULT -ne 0 ] && { echo '--- Last 50 lines of install log ---'; tail -50 /tmp/install-aio.log; }
            exit \$RESULT
          " && pass "The all-in-one installation succeeds with firewalld running" \
            || fail "The all-in-one installation fails with firewalld running"

      - name: Check the firewall warning of the installer
        run: |
          source /tmp/firewall_helpers.sh
          on_server "grep -q 'The system has Firewalld enabled' /tmp/install-aio.log" \
            && pass "The installer warns that firewalld is enabled" \
            || fail "The installer does not warn that firewalld is enabled"

      - name: Wait for wazuh-dashboard
        timeout-minutes: 5
        run: |
          source /tmp/firewall_helpers.sh
          on_server "
            ADMIN_PW=\$(sudo grep '^WAZUH_INDEXER_ADMIN_PASSWORD=' /etc/wazuh-indexer/export/credentials.env | tail -n 1 | cut -d= -f2- | tr -d '\"')
            for i in \$(seq 1 30); do
              code=\$(curl -sk -u \"admin:\${ADMIN_PW}\" -o /dev/null -w '%{http_code}' 'https://localhost/status')
              [ \"\$code\" = '200' ] && exit 0
              echo \"  attempt \$i: HTTP \$code, retrying in 10s...\"
              sleep 10
            done
            exit 1
          " && pass "The Wazuh dashboard answers on the server itself" \
            || fail "The Wazuh dashboard does not answer on the server itself after 5 minutes"

      # -----------------------------------------------------------------------
      # Ports closed: the agent host must not reach the server
      # -----------------------------------------------------------------------
      - name: Check that firewalld blocks the agent host
        run: |
          source /tmp/firewall_helpers.sh
          # Only the ports something listens on tell whether firewalld blocks them
          LISTENING=""
          for port in ${{ env.FIREWALL_PORTS }}; do
            if on_server "sudo ss -Hltn 'sport = :${port}' | grep -q ."; then
              LISTENING+="${port} "
            else
              echo "Nothing listens on port ${port} of the server, it is not checked"
            fi
          done
          for port in ${{ env.FIREWALL_REQUIRED_PORTS }}; do
            [[ " ${LISTENING} " == *" ${port} "* ]] || fail "Nothing listens on port ${port} of the server"
          done
          echo "LISTENING_PORTS=${LISTENING% }" >> "$GITHUB_ENV"
          for port in ${LISTENING}; do
            agent_reaches "$port" && fail "Port ${port} of the server is reachable from the agent host before it is opened"
          done
          pass "Ports ${LISTENING% } of the server are blocked from the agent host before they are opened"

      # -----------------------------------------------------------------------
      # Open the documented ports
      # -----------------------------------------------------------------------
      - name: Open the documented ports on the server
        run: |
          source /tmp/firewall_helpers.sh
          ADD_PORTS=""
          for port in ${{ env.FIREWALL_PORTS }}; do ADD_PORTS+=" --add-port=${port}/tcp"; done
          on_server "sudo firewall-cmd --permanent ${ADD_PORTS} && sudo firewall-cmd --reload && sudo firewall-cmd --list-ports" \
            && pass "Ports ${{ env.FIREWALL_PORTS }} opened with firewall-cmd" \
            || fail "firewall-cmd could not open ports ${{ env.FIREWALL_PORTS }}"

      # -----------------------------------------------------------------------
      # Ports open: the agent host reaches the server, enrolls, and the
      # dashboard answers
      # -----------------------------------------------------------------------
      - name: Check that the agent host reaches the server
        run: |
          source /tmp/firewall_helpers.sh
          for port in ${LISTENING_PORTS}; do
            agent_reaches "$port" || fail "Port ${port} of the server is not reachable from the agent host after it is opened"
          done
          pass "Ports ${LISTENING_PORTS} of the server are reachable from the agent host after they are opened"
          ADMIN_PW=$(on_server "sudo grep '^WAZUH_INDEXER_ADMIN_PASSWORD=' /etc/wazuh-indexer/export/credentials.env | tail -n 1 | cut -d= -f2- | tr -d '\"'")
          [ -n "$ADMIN_PW" ] || fail "WAZUH_INDEXER_ADMIN_PASSWORD not found in /etc/wazuh-indexer/export/credentials.env"
          echo "::add-mask::${ADMIN_PW}"
          # The password goes to curl on the standard input, as a config line, so it is not on a command line
          code=$(printf 'user = "admin:%s"\n' "$(printf '%s' "$ADMIN_PW" | sed 's/[\\"]/\\&/g')" \
            | on_agent "curl -sk -K - -o /dev/null -w '%{http_code}' 'https://${SERVER_PRIVATE_IP}/status'")
          [ "$code" = "200" ] && pass "The Wazuh dashboard answers the agent host (HTTP 200)" \
            || fail "The Wazuh dashboard does not answer the agent host (HTTP ${code})"

      - name: Get the Wazuh agent package URL
        run: |
          source /tmp/firewall_helpers.sh
          VERSION="${{ needs.build_tools.outputs.wazuh_version }}"
          if [ "${{ needs.build_tools.outputs.package_type }}" = "staging" ]; then
            python ${{ env.GENERATE_PRESIGNED_URLS_SCRIPT_PATH }} \
              --process test_ansible \
              --wazuh-version "$VERSION" \
              --aws-s3-bucket-dev "${{ vars.AWS_S3_BUCKET_DEV }}"
          else
            curl -sSfo /tmp/artifact_urls.yaml "https://packages.wazuh.com/production/${VERSION%%.*}.x/artifact-urls/artifact_urls_${VERSION}.yaml" \
              || fail "The production artifact URLs of ${VERSION} cannot be downloaded"
          fi
          AGENT_URL=$(grep '^wazuh_agent_amd64_deb:' /tmp/artifact_urls.yaml | cut -d' ' -f2- | tr -d '"' | xargs)
          [ -n "$AGENT_URL" ] || fail "No wazuh_agent_amd64_deb in the artifact URLs"
          echo "::add-mask::${AGENT_URL}"
          echo "AGENT_URL=${AGENT_URL}" >> "$GITHUB_ENV"

      - name: Enroll an agent from the agent host
        timeout-minutes: 15
        run: |
          source /tmp/firewall_helpers.sh
          # The token must name an address of the agent listener certificate: the private address
          ENROLLMENT_TOKEN=$(on_server "sudo /var/wazuh-manager/bin/wazuh-manager-authd --create-enrollment-token \
            --address ${SERVER_PRIVATE_IP} --ttl 1h --max-uses 1 --description firewall-check")
          [ -n "$ENROLLMENT_TOKEN" ] || fail "The enrollment token for ${SERVER_PRIVATE_IP} cannot be created"
          echo "::add-mask::${ENROLLMENT_TOKEN}"
          printf '%s' "$AGENT_URL" | on_agent 'curl -sSfLo /tmp/wazuh-agent.deb "$(cat)"' \
            || fail "The Wazuh agent package cannot be downloaded"
          # The token goes on the standard input, so it is not on a command line
          printf '%s' "$ENROLLMENT_TOKEN" | on_agent "
            TOKEN=\$(cat)
            sudo apt-get update -q
            sudo WAZUH_ENROLLMENT_TOKEN=\"\$TOKEN\" WAZUH_AGENT_NAME='${{ env.AGENT_NAME }}' apt-get install -y /tmp/wazuh-agent.deb
          " || fail "The Wazuh agent package cannot be installed"
          on_agent "sudo systemctl daemon-reload && sudo systemctl enable --now wazuh-agent" \
            || fail "The Wazuh agent cannot be started"
          on_agent "
            for i in \$(seq 1 36); do
              sudo grep -q 'Token bootstrap: enrollment succeeded' /var/ossec/logs/ossec.log && exit 0
              sleep 5
            done
            echo '--- Last 30 lines of the agent log ---'; sudo tail -30 /var/ossec/logs/ossec.log
            exit 1
          " && pass "The agent enrolls through the opened ports (Token bootstrap: enrollment succeeded)" \
            || fail "The agent does not enroll after 3 minutes"

      - name: Check that the agent is active
        timeout-minutes: 5
        run: |
          source /tmp/firewall_helpers.sh
          on_server "
            API_PW=\$(sudo grep '^WAZUH_MANAGER_API_PASSWORD=' /etc/wazuh-manager/export/credentials.env | tail -n 1 | cut -d= -f2- | tr -d '\"')
            for i in \$(seq 1 36); do
              JWT=\$(curl -sk -u \"wazuh-internal-client:\${API_PW}\" -X POST 'https://localhost:55000/security/user/authenticate?raw=true')
              status=\$(curl -sk -H \"Authorization: Bearer \${JWT}\" 'https://localhost:55000/agents?name=${{ env.AGENT_NAME }}&select=status' \
                | grep -o '\"status\": *\"[a-z_]*\"' | head -n 1)
              echo \"  attempt \$i: \${status:-no agent}\"
              [[ \"\$status\" == *'\"active\"' ]] && exit 0
              sleep 5
            done
            exit 1
          " && pass "The agent is active in the Wazuh server API" \
            || fail "The agent is not active in the Wazuh server API after 3 minutes"

      # -----------------------------------------------------------------------
      # Uninstall with firewalld running
      # -----------------------------------------------------------------------
      - name: Uninstall Wazuh
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 30
        run: |
          source /tmp/firewall_helpers.sh
          on_server "sudo bash /tmp/wazuh-install.sh --uninstall 2>&1 | tee /tmp/install-uninstall.log; exit \${PIPESTATUS[0]}" \
            && pass "The uninstallation succeeds with firewalld running" \
            || fail "The uninstallation fails with firewalld running"

      - name: Create step summary
        if: always()
        run: |
          echo "## 🧱 Firewall check — AIO on ${{ env.SERVER_SYSTEM }} with firewalld, agent on ${{ env.AGENT_SYSTEM }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s "$RESULTS_FILE" ]; then cat "$RESULTS_FILE" >> $GITHUB_STEP_SUMMARY; else echo "No results." >> $GITHUB_STEP_SUMMARY; fi

      - name: Post PR comment with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- integration-check-firewall -->';
            let body = `${marker}\n## 🧱 Firewall check — AIO on \`${process.env.SERVER_SYSTEM}\` with firewalld, agent on \`${process.env.AGENT_SYSTEM}\`\n\n`;
            body += process.env.JOB_STATUS === 'success' ? '✅ **All checks passed!**\n\n' : '❌ **Some checks failed**\n\n';
            if (fs.existsSync(process.env.RESULTS_FILE)) {
              body += fs.readFileSync(process.env.RESULTS_FILE, 'utf8') + '\n';
            }
            body += `- **Workflow:** [View Details](${context.payload.repository.html_url}/actions/runs/${context.runId})\n`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

      # -----------------------------------------------------------------------
      # Cleanup: always deallocate both instances
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials for cleanup
        if: always()
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          role-session-name: assistant-firewall-cleanup-${{ github.run_id }}
          aws-region: ${{ env.REGION }}

      - name: Deallocate instances
        if: always()
        run: |
          RESULT=0
          for dir in /tmp/allocator_server /tmp/allocator_agent; do
            [ -f "$dir/track.yml" ] || continue
            python3 wazuh-automation/deployability/modules/allocation/main.py \
              --action delete \
              --track-output "$dir/track.yml" || RESULT=1
          done
          exit $RESULT
